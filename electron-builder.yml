# electron-builder configuration for Sound It Out.
#
# Produces one installer per platform, each carrying everything the app needs:
# the Electron shell, the frozen Python sidecar, the Kokoro weights, the Andika
# fonts and the recorded phoneme clips. Nothing is downloaded on first run,
# because the machine this ships to is not assumed to have internet at all.

appId: com.nwcnwc.sounditout
productName: Sound It Out
copyright: Copyright © 2026 nwcnwc

directories:
  output: dist/installers
  buildResources: build/installer

# ---------------------------------------------------------------- app source
#
# Only the Electron half goes inside the app bundle. gen/ is not listed: the
# Python is shipped as the frozen sidecar under extraResources, not as source.
files:
  - package.json
  - app/**/*
  - "!**/*.map"
  - "!**/__pycache__/**"

# frames.js loads Andika by building a file:// URL and handing it to Chromium.
# Chromium's network stack cannot read out of an asar archive, so the fonts
# must exist as real files on disk or every rendered frame falls back to a
# system font - which for this app means the wrong letterforms (two-story `a`
# and `g`), i.e. the one thing the font choice exists to prevent.
asarUnpack:
  - app/fonts/**

# ----------------------------------------------------------- bundled payload
#
# Landed next to the app as plain files (Resources/ on macOS and Linux,
# resources/ on Windows) so both the sidecar and ffmpeg can open them by path.
extraResources:
  # ~338MB of Kokoro weights. Deliberately outside the PyInstaller bundle: a
  # onefile executable re-unpacks its whole payload on every launch.
  - from: models
    to: models
    filter:
      - "**/*"

  # User-editable. Shipping them unpacked is the point - a parent can open
  # sight-words.txt in TextEdit and add a cousin's name.
  #
  # ONLY the .default.txt files. When the app runs from source, wordlists/ is
  # also where the running app SAVES the family's real list - their child's
  # name, their parents, their pets. Copying the directory wholesale put that
  # file inside every installer, and those installers were published. The
  # filter is what stops a developer's own family ending up in a public
  # release; the app seeds the real list from the default on first run.
  - from: wordlists
    to: wordlists
    filter:
      - "*.default.txt"

  # Hand-checked recorded phoneme clips (Wikimedia Commons sources).
  - from: assets/commons
    to: assets/commons

  # The starter voice: the developer's own 42 phoneme recordings, used for
  # any sound the family has not recorded yet (gen/voice.py). Shipped
  # deliberately - unlike assets/voice, which is a family's private
  # recordings and must never appear in an installer.
  - from: assets/starter-voice
    to: assets/starter-voice

  # The frozen Python sidecar. Globbed rather than named exactly so the same
  # line covers soundout-sidecar and soundout-sidecar.exe.
  - from: dist/sidecar
    to: sidecar
    filter:
      - soundout-sidecar*

# ============================================================================
# CODE SIGNING: INTENTIONALLY ABSENT. DO NOT ADD.
# ============================================================================
# There is no `mac.identity`, no `afterSign` notarization hook, no
# `win.certificateFile`, and no CSC_* secret in CI. That is a decision, not an
# oversight, and it has been made once already - please do not "fix" it.
#
# Signing would cost $99/yr for an Apple Developer account plus roughly $200/yr
# for a Windows OV/EV code-signing certificate, renewed forever, for a private
# family app installed on a handful of machines by one person. The alternative
# cost is a single Gatekeeper / SmartScreen bypass at install time, performed
# once per machine, documented step by step in BUILDING.md.
#
# Recurring money versus a one-time click: the click wins. If this ever ships
# to people outside the family, revisit - and only then.
#
# Explicit rather than merely omitted, so electron-builder does not go hunting
# for a certificate in the keychain on a developer's Mac and sign the build
# with whatever it happens to find.
mac:
  identity: null
  # Ad-hoc signing is still applied by electron-builder on arm64 because macOS
  # will not execute an unsigned arm64 binary at all. That is not real signing
  # and needs no account.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.education
  # The default name for the x64 dmg carries no architecture at all, which is
  # bad twice over: the parent installing it sees two .dmg files and only one
  # of them says what it is for, and updater.js matches Intel with
  # /(x64|intel)/ - an unmarked file falls through to "first dmg found" and can
  # hand an Intel Mac an arm64 build.
  #
  # These are macros, not expressions. electron-builder substitutes ${arch} and
  # friends by name and does nothing else; a ternary in here is not evaluated,
  # it is copied into the filename verbatim, quotes and all, and then fails to
  # upload. The plain-English part of the name (AppleSilicon / Intel) is
  # applied by the build workflow, which can branch.
  artifactName: Sound-It-Out-${version}-Mac-${arch}.${ext}
  # One extendInfo block only - two of them is a duplicated YAML key and
  # electron-builder refuses the whole file.
  extendInfo:
    LSMinimumSystemVersion: "11.0"
    # Required, or macOS denies the microphone and the recording studio
    # silently captures nothing. The app records; it does not upload.
    NSMicrophoneUsageDescription: >-
      Sound It Out records your voice so your child hears you reading,
      instead of a computer voice. Recordings stay on this computer.

dmg:
  title: Sound It Out
  # Plain drag-to-Applications layout. Nothing clever - the person installing
  # this is doing it once.
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications

win:
  artifactName: Sound-It-Out-${version}-Windows-x64.${ext}
  target:
    - target: nsis
      arch:
        - x64
  # No certificateFile / certificateSubjectName - see the block above.
  # SmartScreen will show "Windows protected your PC" on first run; the
  # "More info" -> "Run anyway" path is documented in BUILDING.md.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sound It Out
  # Wordlists the parent has edited live in appData. Uninstalling should not
  # throw away a hand-built list of family names.
  deleteAppDataOnUninstall: false

linux:
  artifactName: Sound-It-Out-${version}-Linux-x64.${ext}
  target:
    - target: AppImage
      arch:
        - x64
  category: Education
  synopsis: Offline phonics reading videos for the TV
  desktop:
    entry:
      Categories: Education;Audio;Video;

# AppImage is chosen over deb/rpm because it is self-mounting and needs no
# install step at all, which suits the "copy it to the machine plugged into the
# TV" workflow. No `appImage.license` is set - the project has no LICENSE file
# yet (README: "License: TBD") and pointing at a missing one fails the build.

# The app never phones home, and that includes update checks. Any new version
# is installed by hand from a build artifact.
publish: null
